<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceNotes Lite</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://jsdelivr.net"></script>
    <style>
        .glow { 
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); 
            border-color: rgba(239, 68, 68, 0.4) !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4 sm:p-8">

    <div class="w-full max-w-3xl flex flex-col gap-6">
        <!-- Header -->
        <header class="flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-2xl font-bold text-indigo-400">🎙️ VoiceNotes Lite</h1>
                <p class="text-xs text-slate-400 mt-0.5">100% Local Code • Privacy-First Silence Formatting</p>
            </div>
        </header>

        <!-- Control Panel -->
        <div class="flex flex-wrap gap-4 items-center justify-between bg-slate-800 p-4 rounded-xl border border-slate-700">
            <div class="flex gap-3">
                <button id="startBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-2 rounded-lg transition flex items-center gap-2 cursor-pointer">
                    🔴 Start Listening
                </button>
                <button id="stopBtn" class="bg-slate-700 hover:bg-slate-600 text-white font-medium px-5 py-2 rounded-lg transition cursor-pointer hidden">
                    ⏹️ Stop & Save
                </button>
            </div>
            <div id="status" class="text-sm text-slate-400 flex items-center gap-2">
                Status: <span class="text-amber-400 font-medium">Ready</span>
            </div>
        </div>

        <!-- Main Workspace -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Left Column: Raw Streaming Transcript -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Live Voice Stream</label>
                <div id="liveTranscript" class="bg-slate-950 border border-slate-800 rounded-xl p-4 h-64 overflow-y-auto text-slate-400 italic whitespace-pre-wrap leading-relaxed">
                    Click "Start Listening" and talk normally...
                </div>
            </div>

            <!-- Right Column: Local Silence Formatted Note -->
            <div class="flex flex-col gap-2">
                <label class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Auto-Segmented Note</label>
                <textarea id="formattedNote" class="bg-slate-950 border border-slate-800 rounded-xl p-4 h-64 text-slate-100 focus:outline-none focus:border-indigo-500 resize-none leading-relaxed" placeholder="Pauses in your speech will automatically format text into clean bullet points..."></textarea>
            </div>
        </main>

        <!-- Actions & History -->
        <div class="flex justify-end gap-3">
            <button id="clearBtn" class="text-sm text-slate-400 hover:text-slate-200 transition cursor-pointer">Clear Workspace</button>
            <button id="saveBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition cursor-pointer">Archive Note</button>
        </div>

        <!-- Saved Notes List -->
        <section class="mt-4">
            <h2 class="text-lg font-bold text-slate-300 mb-3">Saved Notes (Browser Cache)</h2>
            <div id="notesHistory" class="flex flex-col gap-3"></div>
        </section>
    </div>

    <!-- External Script Integration -->
    <script src="script.js"></script>
</body>
</html>
