<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceNotes Pro</title>
    <!-- Stable Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Localized Custom Core Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b0f19] text-slate-200 min-h-screen flex flex-col items-center antialiased selection:bg-indigo-500/30">

    <div class="w-full max-w-4xl px-4 py-8 md:py-12 flex flex-col gap-8">
        
        <!-- Header Section -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
                    🎙️ VoiceNotes <span class="text-xs bg-indigo-500/10 text-indigo-400 font-semibold px-2 py-0.5 rounded-full border border-indigo-500/20">Pro</span>
                </h1>
                <p class="text-sm text-slate-400 mt-1">Continuous ambient listening with smart pause segmentation.</p>
            </div>
            <div id="statusBadge" class="flex items-center gap-2 bg-slate-900 border border-slate-800 rounded-full px-4 py-1.5 text-xs text-slate-400">
                <span class="h-2 w-2 rounded-full bg-amber-400"></span>
                <span>System Ready</span>
            </div>
        </header>

        <!-- Command Station Control Strip -->
        <div class="bg-slate-900/50 border border-slate-800 p-4 rounded-2xl flex flex-col sm:flex-row gap-4 items-center justify-between backdrop-blur-md">
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <button id="startBtn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-xl transition-all shadow-lg shadow-indigo-600/10 active:scale-95 cursor-pointer text-sm">
                    Start Capture
                </button>
                <button id="stopBtn" class="w-full sm:w-auto bg-red-600 hover:bg-red-500 text-white font-medium px-6 py-2.5 rounded-xl hidden transition-all active:scale-95 cursor-pointer text-sm pulse-ring">
                    Stop & Commit
                </button>
            </div>
            <div class="flex items-center gap-4 w-full sm:w-auto justify-end">
                <button id="clearBtn" class="text-xs font-medium text-slate-400 hover:text-slate-200 transition cursor-pointer">
                    Reset Canvas
                </button>
                <button id="saveBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-4 py-2.5 rounded-xl border border-slate-700/60 transition cursor-pointer">
                    Archive Note
                </button>
            </div>
        </div>

        <!-- Split Layout Workspace -->
        <main class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Left Stream Canvas -->
            <div class="flex flex-col gap-2.5">
                <div class="flex justify-between items-center px-1">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Live Input Monitoring</label>
                    <span class="text-[10px] text-slate-500 font-mono">RAW STREAM</span>
                </div>
                <div id="liveTranscript" class="bg-slate-950/60 border border-slate-800 rounded-2xl p-5 h-72 overflow-y-auto text-slate-400 italic whitespace-pre-wrap leading-relaxed text-sm select-none border-dashed transition-all">
                    Initiate capture parameters to begin speech streaming tracking...
                </div>
            </div>

            <!-- Right Segmented Formatted Field -->
            <div class="flex flex-col gap-2.5">
                <div class="flex justify-between items-center px-1">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Formatted Document</label>
                    <span class="text-[10px] text-indigo-400 font-mono font-semibold">AUTO BULLET</span>
                </div>
                <textarea id="formattedNote" class="bg-slate-950 border border-slate-800 rounded-2xl p-5 h-72 text-slate-100 resize-none focus:outline-none focus:border-indigo-500/60 transition-all text-sm leading-relaxed" placeholder="Quiet updates parse automated bullet intervals dynamically inside this working frame..."></textarea>
            </div>
        </main>

        <!-- Dynamic History Module Layout -->
        <section class="mt-4">
            <div class="border-b border-slate-800 pb-3 mb-4">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Local Notebook Cache</h2>
            </div>
            <div id="notesHistory" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Data injections load smoothly here -->
            </div>
        </section>
    </div>
    <!-- Scripting Execution -->
    <script>
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusBadge = document.getElementById('statusBadge');
        const liveTranscript = document.getElementById('liveTranscript');
        const formattedNote = document.getElementById('formattedNote');
        const notesHistory = document.getElementById('notesHistory');

        let recognition, finalTranscript = '', isListening = false, silenceTimer = null;
        const SILENCE_THRESHOLD_MS = 1600;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                clearTimeout(silenceTimer);
                let interimTranscript = '', freshFinalText = '';
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) { 
                        freshFinalText += event.results[i].transcript; 
                    } else { 
                        interimTranscript += event.results[i].transcript; 
                    }
                }
                
                if (freshFinalText) {
                    finalTranscript += freshFinalText;
                    silenceTimer = setTimeout(() => { handleSilenceDetected(); }, SILENCE_THRESHOLD_MS);
                }
                
                liveTranscript.textContent = finalTranscript + interimTranscript;
                liveTranscript.classList.remove('text-slate-400');
                liveTranscript.classList.add('text-slate-200');
                liveTranscript.scrollTop = liveTranscript.scrollHeight;
            };

            recognition.onerror = (e) => { 
                if (e.error === 'no-speech') return; 
                console.error(e);
                updateStatus(`Error: ${e.error}`, 'bg-red-500/20 text-red-400 border-red-500/30'); 
            };
            
            recognition.onend = () => { 
                if (isListening) { recognition.start(); } 
            };
        } else {
            startBtn.disabled = true;
            liveTranscript.textContent = "Voice transcription APIs are missing or blocked inside this sandbox browser environment.";
        }

        function handleSilenceDetected() {
            if (!finalTranscript.trim()) return;
            let cleaned = finalTranscript.trim();
            if (!cleaned.endsWith('\n\n')) { finalTranscript = cleaned + '\n\n• '; }
            formattedNote.value = finalTranscript;
            updateStatus('Segment Logged', 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20');
            setTimeout(() => { 
                if(isListening) updateStatus('Active Recording', 'bg-red-500/10 text-red-400 border-red-500/20', 'bg-red-500'); 
            }, 900);
        }

        startBtn.addEventListener('click', () => {
            if (!recognition) return;
            finalTranscript = '• '; liveTranscript.textContent = ''; formattedNote.value = '';
            isListening = true; recognition.start(); toggleButtons(true);
            updateStatus('Active Recording', 'bg-red-500/10 text-red-400 border-red-500/20', 'bg-red-500');
            liveTranscript.className = "bg-slate-950 border border-indigo-500/30 rounded-2xl p-5 h-72 overflow-y-auto text-slate-200 whitespace-pre-wrap leading-relaxed text-sm transition-all shadow-inner";
        });

        stopBtn.addEventListener('click', () => {
            if (!recognition || !isListening) return;
            clearTimeout(silenceTimer); isListening = false; recognition.stop(); toggleButtons(false);
            liveTranscript.className = "bg-slate-950/60 border border-slate-800 rounded-2xl p-5 h-72 overflow-y-auto text-slate-400 italic whitespace-pre-wrap leading-relaxed text-sm transition-all border-dashed";
            let finishedText = finalTranscript.trim();
            if (finishedText.endsWith('•')) finishedText = finishedText.slice(0, -1).trim();
            formattedNote.value = finishedText;
            updateStatus('System Ready', 'bg-slate-900 text-slate-400 border-slate-800');
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            clearTimeout(silenceTimer); 
            liveTranscript.textContent = 'Initiate capture parameters to begin speech streaming tracking...';
            formattedNote.value = ''; finalTranscript = ''; 
            updateStatus('System Ready', 'bg-slate-900 text-slate-400 border-slate-800');
        });

        document.getElementById('saveBtn').addEventListener('click', () => {
            const content = formattedNote.value.trim();
            if (!content || content === '•') return alert('Canvas must hold text parameters prior to notebook compression caching.');
            const notes = JSON.parse(localStorage.getItem('local_voice_notes') || '[]');
            notes.unshift({ id: Date.now(), text: content, date: new Date().toLocaleDateString(undefined, {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) });
            localStorage.setItem('local_voice_notes', JSON.stringify(notes));
            renderHistory();
            formattedNote.value = ''; finalTranscript = ''; 
            liveTranscript.textContent = 'Initiate capture parameters to begin speech streaming tracking...';
        });

        function toggleButtons(listening) {
            if (listening) { startBtn.classList.add('hidden'); stopBtn.classList.remove('hidden'); } 
            else { startBtn.classList.remove('hidden'); stopBtn.classList.add('hidden'); }
        }

        function updateStatus(text, wrapperClasses, dotClass = 'bg-amber-400') {
            statusBadge.className = `flex items-center gap-2 rounded-full px-4 py-1.5 text-xs font-medium border transition-all ${wrapperClasses}`;
            statusBadge.innerHTML = `<span class="h-2 w-2 rounded-full ${dotClass} ${dotClass.includes('red') ? 'animate-ping' : ''}"></span><span>${text}</span>`;
        }

        function renderHistory() {
            const notes = JSON.parse(localStorage.getItem('local_voice_notes') || '[]');
            if (notes.length === 0) {
                notesHistory.innerHTML = `<div class="col-span-full border border-slate-800 border-dashed rounded-xl p-8 text-center text-xs text-slate-500">Your local log cache is currently empty.</div>`;
                return;
            }
            notesHistory.innerHTML = notes.map(n => `
                <div class="bg-slate-900/30 border border-slate-800/80 p-5 rounded-2xl flex flex-col gap-3 backdrop-blur-sm hover:border-slate-700/60 transition-all group">
                    <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                        <span class="mono text-[10px] text-slate-500 font-medium tracking-tight">${n.date}</span>
                        <button onclick="deleteNote(${n.id})" class="text-[10px] text-slate-500 hover:text-red-400 transition cursor-pointer opacity-0 group-hover:opacity-100 font-medium">Delete</button>
                    </div>
                    <div class="text-slate-300 text-sm whitespace-pre-wrap leading-relaxed">${n.text.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t]))}</div>
                </div>
            `).join('');
        }

        window.deleteNote = function(id) {
            let notes = JSON.parse(localStorage.getItem('local_voice_notes') || '[]');
            notes = notes.filter(note => note.id !== id);
            localStorage.setItem('local_voice_notes', JSON.stringify(notes));
            renderHistory();
        };

        renderHistory();
    </script>
</body>
</html>
